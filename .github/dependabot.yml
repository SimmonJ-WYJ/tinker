# Dependabot dependency updates (#418 / PRD 0.3.0 §V Security, Operations row).
# Repository Settings → Code security → Dependabot security updates enables
# vulnerability-driven repair PRs; this file supplies grouping and rate limits.
# Security-fix PRs only: open-pull-requests-limit: 0 pauses ordinary version updates.
# Both security and version updates run ci.yml audit; high-risk flaws cannot bypass merge gates.
version: 2
updates:
  # Bun monorepo: resolve root workspaces (packages/* + apps/*) and bun.lock.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "liningftp"

  # GitHub Actions: security fixes only; ordinary version updates remain disabled.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-actions:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    reviewers:
      - "liningftp"
