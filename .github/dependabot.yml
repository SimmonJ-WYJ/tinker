# Dependabot 依赖更新配置（#418 / PRD 0.3.0 §五 安全机制 "运维" 行）。
# 漏洞驱动的自动修复 PR（Dependabot security updates）由仓库 Settings →
# Code security → "Dependabot security updates" 开关启用；本文件提供分组与限流策略。
# 当前只保留安全修复 PR：普通 version updates 通过 open-pull-requests-limit: 0 暂停。
# security updates 与版本更新都会跑 ci.yml 的 audit job —— 高危漏洞无法绕过合并门槛。
version: 2
updates:
  # Bun monorepo：在根目录解析 workspaces（packages/* + apps/*）与 bun.lock。
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "liningftp"

  # GitHub Actions 仅保留安全修复 PR，常规追新暂不开启。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-actions:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    reviewers:
      - "liningftp"
