[package]
name = "tinker-rust-foundation"
version = "0.0.1"
edition = "2021"
default-run = "tinker-rust-foundation"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.149"
reqwest = { version = "=0.13.2", default-features = false, features = ["rustls", "json"] }
tokio = { version = "=1.51.0", features = ["rt", "time", "macros"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2.10", features = ["test"] }
